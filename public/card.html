<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0D0C">
<title>Carlos Rojas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Carlos Rojas: ECE at UT Austin. Resume, LinkedIn, portfolio and GitHub.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; }
  :root { padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); }
  [hidden] { display: none !important; }
  /* Layout: one physical NFC card floating at center stage; layers sit at different depths and tilt with the phone. */
  :root {
    --bg: #E6E3E1;
    --fg: #2B2623;
    --muted: #7A706A;
    --shadow: rgba(40, 22, 10, .38);
    /* the card is an object, so it keeps the same finish in both themes */
    --card-hi: #221E1B;
    --card-lo: #0E0D0C;
    --ink: #F4EFEA;
    --dim: #948A83;
    --line: rgba(255, 255, 255, .08);
    --orange: #BF5700;
    --orange-lit: #E8782A;
    --copper: #C27A44;
    --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A0909; --fg: #D8D0CA; --muted: #7E746E; --shadow: rgba(191, 87, 0, .22);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A0909; --fg: #D8D0CA; --muted: #7E746E; --shadow: rgba(191, 87, 0, .22);
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .stage {
    min-height: 100%;
    display: grid;
    place-items: center;
    align-content: center;
    gap: 22px;
    padding-block: 28px;
  }

  .scene {
    position: relative;
    width: min(372px, 100%);
    perspective: 1000px;
  }

  .shadow {
    position: absolute;
    left: 10%; right: 10%; bottom: -30px;
    height: 46px;
    background: radial-gradient(closest-side, var(--shadow), transparent);
    filter: blur(8px);
    pointer-events: none;
  }

  .card {
    position: relative;
    border-radius: 22px;
    background:
      radial-gradient(130% 70% at 15% 0%, var(--card-hi), var(--card-lo) 65%);
    color: var(--ink);
    transform-style: preserve-3d;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 0 0 1px rgba(255, 255, 255, .04);
    will-change: transform;
    --gx: 50%; --gy: 30%; --hp: 50%; --glint: 0;
  }
  /* finger-drag tilt only when the page fits one screen, so it never blocks scrolling */
  .card.grab { touch-action: none; }
  .card a, .card button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

  .layer { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }

  /* NFC inlay: the antenna coil runs around the card's perimeter, like the real one */
  .antenna {
    inset: 9px;
    border-radius: 15px;
    box-shadow:
      inset 0 0 0 1px var(--copper),
      inset 0 0 0 4px var(--card-lo),
      inset 0 0 0 5px var(--copper),
      inset 0 0 0 8px var(--card-lo),
      inset 0 0 0 9px var(--copper),
      inset 0 0 0 12px var(--card-lo),
      inset 0 0 0 13px var(--copper);
    opacity: calc(.16 + var(--glint) * .5);
    transform: translateZ(1px);
  }
  .holo {
    background: linear-gradient(115deg,
      transparent 32%,
      hsla(28, 95%, 60%, .13) 44%,
      hsla(190, 90%, 65%, .09) 52%,
      hsla(300, 80%, 70%, .08) 58%,
      transparent 70%);
    background-size: 260% 260%;
    background-position: var(--hp) var(--hp);
    transform: translateZ(2px);
  }
  .sheen {
    background: radial-gradient(circle at var(--gx) var(--gy), rgba(255, 255, 255, .16), rgba(255, 255, 255, .03) 32%, transparent 55%);
    transform: translateZ(4px);
    border-radius: 22px;
  }

  .content {
    position: relative;
    display: grid;
    gap: 22px;
    padding: 28px 26px 24px;
    transform-style: preserve-3d;
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    transform: translateZ(16px);
  }
  .chip { width: 40px; height: 31px; display: block; }
  .freq {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .freq svg { width: 16px; height: 16px; color: var(--orange-lit); }

  .id {
    display: grid;
    grid-template-columns: 78px 1fr;
    gap: 16px;
    align-items: center;
    transform: translateZ(36px);
  }
  .id img {
    width: 78px; height: 78px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 0 0 1.5px var(--orange), 0 8px 20px rgba(0, 0, 0, .5);
  }
  .id > div { min-width: 0; }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-variation-settings: "wdth" 125;
    font-weight: 800;
    font-size: clamp(25px, 8vw, 30px);
    line-height: .95;
    letter-spacing: .01em;
    text-transform: uppercase;
    text-shadow: 0 1px 0 rgba(255, 255, 255, .14), 0 -1px 0 rgba(0, 0, 0, .7);
  }
  .role {
    margin: 8px 0 0;
    font-size: 13px;
    line-height: 1.4;
    color: var(--dim);
  }
  .role b { color: var(--ink); font-weight: 600; }

  .links {
    display: grid;
    gap: 8px;
    transform: translateZ(26px);
    transform-style: preserve-3d;
  }
  .link {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(255, 255, 255, .04);
    border: 1px solid var(--line);
    color: var(--ink);
    text-decoration: none;
    transition: background-color .2s, border-color .2s, transform .2s;
  }
  .link > span { min-width: 0; display: grid; gap: 2px; }
  .link .name { font-size: 15.5px; font-weight: 600; }
  .link .sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .link svg { width: 18px; height: 18px; opacity: .7; }
  @media (hover: hover) {
    a.link:hover { background: rgba(255, 255, 255, .08); border-color: rgba(232, 120, 42, .55); transform: translateZ(6px); }
    a.link.primary:hover { background: #CF6106; border-color: transparent; }
    .foot a:hover { color: var(--ink); }
  }
  a.link:focus-visible { background: rgba(255, 255, 255, .08); border-color: rgba(232, 120, 42, .55); }
  a.link:active { background: rgba(255, 255, 255, .1); transform: scale(.98); transition-duration: .06s; }
  a.link.primary:active { background: #A84C00; }
  .link.primary { background: var(--orange); border-color: transparent; }
  .link.primary .sub { color: rgba(255, 255, 255, .78); }
  .link.primary svg { opacity: 1; }
  a.link.primary:focus-visible { background: #CF6106; border-color: transparent; }
  :focus-visible { outline: 2px solid var(--orange-lit); outline-offset: 2px; }

  .mail { padding-block: 9px; padding-right: 8px; }
  /* show the whole address on narrow phones instead of cutting it off */
  .mail .sub { white-space: normal; overflow-wrap: anywhere; color: var(--ink); opacity: .8; }
  .mail a { color: inherit; text-decoration: none; }
  .copy {
    font: 500 11px/1 var(--mono);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink);
    background: rgba(255, 255, 255, .07);
    border: 1px solid var(--line);
    border-radius: 8px;
    min-height: 40px;
    padding: 0 12px;
    cursor: pointer;
  }
  .copy:active { background: rgba(255, 255, 255, .16); }
  .copy:hover { background: rgba(255, 255, 255, .12); }

  .foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--dim);
    transform: translateZ(12px);
  }
  .foot nav { display: flex; gap: 2px; }
  /* small text, full-size tap target */
  .foot a { color: var(--dim); text-decoration: none; display: inline-flex; align-items: center; min-height: 40px; padding: 0 8px; }
  .foot nav a:last-child { padding-right: 2px; }
  .foot a:active { color: var(--ink); }

  /* shorter phones (iPhone SE, mini, small Androids): tighten so the whole card fits one screen */
  @media (max-height: 760px) {
    .stage { gap: 14px; padding-block: 14px; }
    .content { gap: 16px; padding: 22px 24px 18px; }
    .id { grid-template-columns: 64px 1fr; gap: 14px; }
    .id img { width: 64px; height: 64px; }
    .links { gap: 6px; }
    .link { padding: 9px 13px; }
    .link .name { font-size: 15px; }
  }
  @media (max-height: 620px) {
    .top { display: none; }
    .role br { display: none; }
  }

  .under {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 34px;
  }
  .hint {
    margin: 0;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .enable {
    font: 500 11px/1 var(--mono);
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--muted);
    border-radius: 999px;
    padding: 10px 14px;
    cursor: pointer;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 12px);
    opacity: 0;
    transition: opacity .2s, transform .2s;
    background: var(--fg);
    color: var(--bg);
    font: 500 12px/1 var(--mono);
    letter-spacing: .06em;
    padding: 11px 14px;
    border-radius: 10px;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .link, .toast { transition: none; }
  }
</style>
</head>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const card = document.getElementById("card");
  const shadow = document.getElementById("shadow");
  const hint = document.getElementById("hint");
  const enable = document.getElementById("enable");
  const MAX = 16;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const touch = matchMedia("(pointer: coarse)").matches;
  const clamp = (v, m) => Math.max(-m, Math.min(m, v));

  // current and target rotation in degrees; start tipped back so the card settles in on load
  let x = 22, y = -14, tx = 0, ty = 0;
  let source = "idle", lastInput = 0;

  function setTarget(rx, ry, from) {
    tx = clamp(rx, MAX); ty = clamp(ry, MAX);
    source = from; lastInput = performance.now();
  }

  function render(now) {
    if (source !== "gyro" && now - lastInput > 2200) {
      tx = Math.sin(now / 1900) * 5;
      ty = Math.cos(now / 2600) * 7;
    }
    x += (tx - x) * 0.1;
    y += (ty - y) * 0.1;
    card.style.transform = `rotateX(${x.toFixed(2)}deg) rotateY(${y.toFixed(2)}deg)`;
    card.style.setProperty("--gx", `${50 + (y / MAX) * 45}%`);
    card.style.setProperty("--gy", `${35 - (x / MAX) * 45}%`);
    card.style.setProperty("--hp", `${50 + ((y - x) / MAX) * 40}%`);
    card.style.setProperty("--glint", Math.min(1, Math.hypot(x, y) / MAX).toFixed(3));
    shadow.style.transform = `translate(${(-y * 1.1).toFixed(1)}px, ${(x * 0.6).toFixed(1)}px) scale(${1 - Math.abs(x) / 120})`;
    requestAnimationFrame(render);
  }

  // Cursor / finger fallback: tilt toward the pointer
  let dragging = false;
  function onPointer(e) {
    if (source === "gyro") return;
    if (e.pointerType !== "mouse" && !dragging) return;
    const r = card.getBoundingClientRect();
    const mx = (e.clientX - r.left) / r.width - 0.5;
    const my = (e.clientY - r.top) / r.height - 0.5;
    setTarget(-my * MAX * 1.6, mx * MAX * 1.6, "pointer");
  }
  addEventListener("pointermove", onPointer);
  card.addEventListener("pointerdown", e => {
    if (e.pointerType !== "mouse" && source !== "gyro") { dragging = true; onPointer(e); }
  });
  addEventListener("pointerup", () => { dragging = false; });
  addEventListener("pointercancel", () => { dragging = false; });

  // Let a finger drag tilt the card only when nothing needs scrolling
  function fitCheck() {
    const fits = document.documentElement.scrollHeight <= innerHeight + 1;
    card.classList.toggle("grab", touch && fits && source !== "gyro");
  }
  addEventListener("resize", fitCheck);

  // Gyro: tilt relative to however the phone is being held, re-centering slowly
  let base = null;
  function screenAngle() {
    return (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  }
  function onOrient(e) {
    if (e.beta == null || e.gamma == null) return;
    // map to the screen's own axes so landscape tilts the right way
    const a = ((screenAngle() % 360) + 360) % 360;
    const fb = a === 90 ? -e.gamma : a === 270 ? e.gamma : a === 180 ? -e.beta : e.beta;
    const lr = a === 90 ? e.beta : a === 270 ? -e.beta : a === 180 ? -e.gamma : e.gamma;
    if (!base) {
      base = { b: fb, g: lr };
      hint.textContent = "Tilt your phone";
      hint.hidden = false;
      enable.hidden = true;
      card.classList.remove("grab");
    }
    const db = fb - base.b, dg = lr - base.g;
    base.b += db * 0.004; base.g += dg * 0.004;
    setTarget(-db * 0.9, dg * 0.9, "gyro");
  }
  function listen() { addEventListener("deviceorientation", onOrient); }
  addEventListener("orientationchange", () => { base = null; });

  let asked = false;
  async function askPermission() {
    if (asked) return;
    asked = true;
    enable.hidden = true;
    hint.hidden = false;
    try {
      const state = await DeviceOrientationEvent.requestPermission();
      if (state === "granted") listen();
    } catch {}
  }

  if (touch) hint.textContent = "Drag the card to tilt";
  if (!reduced && "DeviceOrientationEvent" in window) {
    if (typeof DeviceOrientationEvent.requestPermission === "function") {
      // iOS shares motion data only after a tap: the button, or any tap on the card that isn't a link
      enable.hidden = false;
      hint.hidden = true;
      enable.addEventListener("click", askPermission);
      card.addEventListener("click", e => { if (!e.target.closest("a, button")) askPermission(); });
    } else {
      listen();
    }
  }
  fitCheck();

  if (reduced) {
    hint.hidden = true;
  } else {
    requestAnimationFrame(render);
  }

  // Copy email
  const toast = document.getElementById("toast");
  let toastTimer;
  function say(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
  }
  document.getElementById("copy").addEventListener("click", () => {
    const addr = document.getElementById("email").textContent;
    navigator.clipboard.writeText(addr).then(
      () => say("Email copied"),
      () => {
        const range = document.createRange();
        range.selectNodeContents(document.getElementById("email"));
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
        say("Selected. Copy it from the menu");
      }
    );
  });
})();
</script>
